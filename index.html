<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเปลี่ยนถ่ายน้ำมันเครื่อง</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🚗 ระบบบันทึกเปลี่ยนถ่ายน้ำมันเครื่อง</h2>
        
        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="oilForm">
            <div class="form-group">
                <label>วันที่:</label>
                <input type="date" id="oilDate" required>
            </div>
            <div class="form-group">
                <label>เลขไมล์ปัจจุบัน (กม.):</label>
                <input type="number" id="currentMileage" placeholder="เช่น 50000" required>
            </div>
            <div class="form-group">
                <label>ยี่ห้อ / ชนิดน้ำมันเครื่อง:</label>
                <input type="text" id="oilBrand" placeholder="เช่น Castrol 10W-40" required>
            </div>
            <div class="form-group">
                <label>ระยะเปลี่ยนถ่ายรอบหน้า (กม. ที่ต้องเปลี่ยน):</label>
                <input type="number" id="nextMileage" placeholder="เช่น 60000" required>
            </div>
            <div class="form-group">
                <label>หมายเหตุ / รายละเอียด:</label>
                <textarea id="note" placeholder="เปลี่ยนพร้อมไส้กรอง..."></textarea>
            </div>
            <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
        </form>

        <!-- ตารางแสดงประวัติ -->
        <div class="history-section">
            <h3>📜 ประวัติการเปลี่ยนถ่ายน้ำมันเครื่อง</h3>
            <table id="oilTable">
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>เลขไมล์</th>
                        <th>น้ำมันเครื่อง</th>
                        <th>ครบกำหนดรอบหน้า</th>
                        <th>หมายเหตุ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="oilTableBody">
                    <!-- ข้อมูลจะถูกเติมเข้ามาตรงนี้ด้วย JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
